[package]
name = "fastchunk"
version = "0.2.0"
edition = "2021"

[lib]
name = "fastchunk"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22.6", features = ["extension-module"] }
rayon = "1.10"
fastchunk-core = { path = "../fastchunk-core" }

[profile.release]
lto = true
codegen-units = 1
